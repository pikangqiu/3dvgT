[project]
name = "vggt-satellite-reconstruction"
version = "0.1.0"
description = "Satellite-guided and BEV-guided G3T-style 3D reconstruction research scaffold."
requires-python = ">=3.10"
dependencies = [
  "huggingface-hub>=0.23",
  "numpy>=1.24",
  "pillow>=10",
  "pyyaml>=6",
  "tqdm>=4.66",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "scripts"]
