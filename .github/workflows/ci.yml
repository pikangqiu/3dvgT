name: CI

on:
  push:
  pull_request:

jobs:
  lightweight-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package metadata dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run lightweight unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Audit project scaffold
        run: PYTHONPATH=src python3 scripts/audit_project_status.py

      - name: Check reference clone plan
        run: PYTHONPATH=src python3 scripts/setup_references.py --dry-run

      - name: Check training bootstrap CLI
        run: PYTHONPATH=src python3 scripts/bootstrap_training_run.py --help

      - name: Check checkpoint inspection CLI
        run: PYTHONPATH=src python3 scripts/inspect_checkpoint.py --help

      - name: Check model weight preparation CLI
        run: bash scripts/prepare_model_weights.sh --help

      - name: Check model weight config CLI
        run: PYTHONPATH=src python3 scripts/configure_model_weights.py --help

      - name: Check external asset CLI
        run: PYTHONPATH=src python3 scripts/check_external_assets.py --help

      - name: Check environment report CLI
        run: PYTHONPATH=src python3 scripts/report_environment.py --help

      - name: Check real training preflight CLI
        run: PYTHONPATH=src python3 scripts/report_real_training_preflight.py --help

      - name: Check manifest forward probe CLI
        run: PYTHONPATH=src python3 scripts/probe_manifest_forward.py --help

      - name: Check training artifact verifier CLI
        run: PYTHONPATH=src python3 scripts/verify_training_artifacts.py --help

      - name: Check real run evidence verifier CLI
        run: PYTHONPATH=src python3 scripts/verify_real_run_evidence.py --help

      - name: Check Occ3D label attach CLI
        run: PYTHONPATH=src python3 scripts/attach_occ3d_labels.py --help

      - name: Check public occupancy manifest validation CLI
        run: PYTHONPATH=src python3 scripts/validate_public_occupancy_manifest.py --help

      - name: Check occupancy label validation CLI
        run: PYTHONPATH=src python3 scripts/validate_occupancy_labels.py --help

      - name: Check occupancy prediction export CLI
        run: PYTHONPATH=src python3 scripts/export_occupancy_predictions.py --help

      - name: Check occupancy benchmark CLI
        run: PYTHONPATH=src python3 scripts/evaluate_occupancy_benchmark.py --help

      - name: Compile Python files
        run: python3 -m compileall src scripts tests
